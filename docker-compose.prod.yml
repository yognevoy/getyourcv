name: getyourcv-prod

services:
    caddy:
        build:
            context: .
            target: caddy
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - storage_data:/var/www/html/storage/app:ro
        environment:
            DOMAIN: ${DOMAIN}
            LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: .
            target: php-fpm
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - storage_data:/var/www/html/storage/app
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    storage_data:
    caddy_data:
    caddy_config:
